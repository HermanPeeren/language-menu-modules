PLG_TASK_LANGUAGEMENUMODULES="Task - Language Menu Modules"
PLG_TASK_LANGUAGEMENUMODULES_XML_DESCRIPTION="Temporary: creates, for every content language of the User Guide, the top menu module and the five side menu modules (Explanations, Tutorials, How-to Guides, Admin Pages References, Contributors) as copies of the German ones, straight in the database, and makes the translation of the home page the home page of each language."

PLG_TASK_LANGUAGEMENUMODULES_CREATE_TITLE="Language menu modules: create"
PLG_TASK_LANGUAGEMENUMODULES_CREATE_DESC="Makes the menu modules a content language does not have yet: the top menu on position-1 and the five side menus on position-8, copies of the German ones with the menu (mainmenu-xx-xx) and language of the new language, the side menus assigned to the pages of their branch. Puts the modules of each kind together, in the order of the language codes. Dry run by default."

PLG_TASK_LANGUAGEMENUMODULES_FIELD_DRY_RUN_LABEL="Dry run"
PLG_TASK_LANGUAGEMENUMODULES_FIELD_DRY_RUN_DESC="Log what would be done, without saving anything. Switch this off to write."
PLG_TASK_LANGUAGEMENUMODULES_FIELD_COMPLETE_PAGES_LABEL="Complete the pages of existing modules"
PLG_TASK_LANGUAGEMENUMODULES_FIELD_COMPLETE_PAGES_DESC="Assign the menu modules that exist already (English, German) also to the pages of their branch they are not assigned to yet, such as the groups under Admin Pages References. Only adds pages."
PLG_TASK_LANGUAGEMENUMODULES_FIELD_FIX_SOURCE_LABEL="Give the English modules their language"
PLG_TASK_LANGUAGEMENUMODULES_FIELD_FIX_SOURCE_DESC="Set the language of the English menu modules that have 'All' to English, so the English top menu no longer shows on the pages of the other languages, and title the English top menu module 'Mainmenu'."
PLG_TASK_LANGUAGEMENUMODULES_FIELD_SET_HOMES_LABEL="Set the home page of every language"
PLG_TASK_LANGUAGEMENUMODULES_FIELD_SET_HOMES_DESC="Make the translation of the English home page the home page of each language that has none, so the language shows in the language switcher."

PLG_TASK_LANGUAGEMENUMODULES_LOG_FAILED="Creating the language menu modules stopped: %s"
